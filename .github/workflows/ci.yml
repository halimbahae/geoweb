name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ffmpeg (video tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint
        run: uvx ruff check .

      - name: Test
        run: uv run pytest

      - name: Compile & syntax-check
        run: |
          python3 -m compileall -q web video tests mcp
          node --check web/static/app.js
          node --check landing/assets/js/landing.js

      - name: Verify scripts compile
        run: python3 -m py_compile scripts/*.py